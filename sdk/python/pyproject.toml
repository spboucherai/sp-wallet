[project]
name = "sp-wallet-python"
version = "0.1.0"
description = "Official Python client of the SP Wallet Trading API (sync and async, typed models, safe retries and idempotency)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx==0.28.1",
    "pydantic==2.14.3",
]

[project.optional-dependencies]
# sp_wallet.stream (the websocket of the quote engine): pip install "sp-wallet-python[stream]"
stream = ["websockets==16.0"]

[dependency-groups]
dev = [
    "jsonschema==4.26.0",
    "pytest==9.2.0",
    "ruff==0.17.5",
    "websockets==16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sp_wallet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -ra"
markers = [
    "integration: starts the real API locally (needs PostgreSQL and the repository's node_modules); skipped otherwise",
]

[tool.ruff]
line-length = 160
target-version = "py310"
src = ["src", "tests", "scripts", "examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "ASYNC", "PT", "T20"]
ignore = [
    "S101",    # assert: used by the tests and for internal invariants
    "RUF001", "RUF002", "RUF003",  # typographic characters in strings and comments are intended
]

[tool.ruff.lint.per-file-ignores]
"src/sp_wallet/models.py" = ["E501", "RUF022"]           # generated from the OpenAPI document
"tests/*" = ["E501", "PT018", "S105", "S106", "S603", "S607", "SIM108", "T20"]  # tables of cases are kept on one line
"examples/*" = ["T20"]
"scripts/*" = ["T20", "S603", "S607"]
